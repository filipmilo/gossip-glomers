[package]
name = "gossip-glomers"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.68"
env_logger = "0.10.0"
log = "0.4.17"
serde = { version = "1.0.159", features = ["derive"] }
serde_json = "1.0.95"
tokio = { version = "1.27.0", features = ["full"] }
tokio-context = "0.1.3"
maelstrom-node = "0.1.6"

[dependencies.uuid]
version = "1.16.0"
features = ["v4"]

[[bin]]
name = "echo"

[[bin]]
name = "unique_ids"
